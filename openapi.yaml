openapi: 3.0.3
info:
  title: GitLite API
  version: 1.27.3
  description: Subset of the GitLite API covered by these docs. Extracted from
    templates/swagger/v1_openapi3_json.tmpl in the gitlite repository.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000/api/v1
security:
  - BasicAuth: []
  - Token: []
  - AccessToken: []
  - AuthorizationHeaderToken: []
  - SudoParam: []
  - SudoHeader: []
  - TOTPHeader: []
paths:
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          $ref: "#/components/responses/ServerVersion"
      summary: Returns the version of the Gitea application
      tags:
        - miscellaneous
  /settings/api:
    get:
      operationId: getGeneralAPISettings
      responses:
        "200":
          $ref: "#/components/responses/GeneralAPISettings"
      summary: Get instance's global settings for api
      tags:
        - settings
  /user:
    get:
      operationId: userGetCurrent
      responses:
        "200":
          $ref: "#/components/responses/User"
      summary: Get the authenticated user
      tags:
        - user
  /user/repos:
    get:
      operationId: userCurrentListRepos
      parameters:
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/RepositoryList"
      summary: List the repos that the authenticated user owns
      tags:
        - user
    post:
      operationId: createCurrentUserRepo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/Repository"
        "400":
          $ref: "#/components/responses/error"
        "409":
          description: The repository with the same name already exists.
        "422":
          $ref: "#/components/responses/validationError"
      summary: Create a repository
      tags:
        - repository
        - user
  /users/{username}/tokens:
    get:
      operationId: userGetTokens
      parameters:
        - description: username of to user whose access tokens are to be listed
          in: path
          name: username
          required: true
          schema:
            type: string
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/AccessTokenList"
        "403":
          $ref: "#/components/responses/forbidden"
      summary: List the authenticated user's access tokens
      tags:
        - user
    post:
      operationId: userCreateToken
      parameters:
        - description: username of the user whose token is to be created
          in: path
          name: username
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/AccessToken"
        "400":
          $ref: "#/components/responses/error"
        "403":
          $ref: "#/components/responses/forbidden"
      summary: Create an access token
      tags:
        - user
  /repos/{owner}/{repo}:
    delete:
      operationId: repoDelete
      parameters:
        - description: owner of the repo to delete
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo to delete
          in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/empty"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Delete a repository
      tags:
        - repository
    get:
      operationId: repoGet
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Get a repository
      tags:
        - repository
    patch:
      operationId: repoEdit
      parameters:
        - description: owner of the repo to edit
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo to edit
          in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRepoOption"
        description: Properties of a repo that you can edit
        x-originalParamName: body
      responses:
        "200":
          $ref: "#/components/responses/Repository"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/validationError"
      summary: Edit a repository's properties. Only fields that are set will be changed.
      tags:
        - repository
  /repos/{owner}/{repo}/issues:
    get:
      operationId: issueListIssues
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
        - description: whether issue is open or closed
          in: query
          name: state
          schema:
            enum:
              - closed
              - open
              - all
            type: string
        - description: comma separated list of label names. Fetch only issues that have
            any of this label names. Non existent labels are discarded.
          in: query
          name: labels
          schema:
            type: string
        - description: search string
          in: query
          name: q
          schema:
            type: string
        - description: filter by type (issues / pulls) if set
          in: query
          name: type
          schema:
            enum:
              - issues
              - pulls
            type: string
        - description: comma separated list of milestone names or ids. It uses names and
            fall back to ids. Fetch only issues that have any of this
            milestones. Non existent milestones are discarded
          in: query
          name: milestones
          schema:
            type: string
        - description: Only show items updated after the given time. This is a timestamp
            in RFC 3339 format
          in: query
          name: since
          schema:
            format: date-time
            type: string
        - description: Only show items updated before the given time. This is a timestamp
            in RFC 3339 format
          in: query
          name: before
          schema:
            format: date-time
            type: string
        - description: Only show items which were created by the given user
          in: query
          name: created_by
          schema:
            type: string
        - description: Only show items for which the given user is assigned
          in: query
          name: assigned_by
          schema:
            type: string
        - description: Only show items in which the given user was mentioned
          in: query
          name: mentioned_by
          schema:
            type: string
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/IssueList"
        "404":
          $ref: "#/components/responses/notFound"
      summary: List a repository's issues
      tags:
        - issue
    post:
      operationId: issueCreateIssue
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/Issue"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "412":
          $ref: "#/components/responses/error"
        "422":
          $ref: "#/components/responses/validationError"
        "423":
          $ref: "#/components/responses/repoArchivedError"
      summary: Create an issue. If using deadline only the date will be taken into
        account, and time of day ignored.
      tags:
        - issue
  /repos/{owner}/{repo}/issues/{index}:
    delete:
      operationId: issueDelete
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
        - description: index of issue to delete
          in: path
          name: index
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          $ref: "#/components/responses/empty"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Delete an issue
      tags:
        - issue
    get:
      operationId: issueGetIssue
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
        - description: index of the issue to get
          in: path
          name: index
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Get an issue
      tags:
        - issue
    patch:
      description: >
        Pass `content_version` to enable optimistic locking on body edits.

        If the version doesn't match the current value, the request fails with
        409 Conflict.
      operationId: issueEditIssue
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
        - description: index of the issue to edit
          in: path
          name: index
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditIssueOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/Issue"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "412":
          $ref: "#/components/responses/error"
      summary: Edit an issue. If using deadline only the date will be taken into
        account, and time of day ignored.
      tags:
        - issue
  /repos/{owner}/{repo}/hooks:
    get:
      operationId: repoListHooks
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/HookList"
        "404":
          $ref: "#/components/responses/notFound"
      summary: List the hooks in a repository
      tags:
        - repository
    post:
      operationId: repoCreateHook
      parameters:
        - description: owner of the repo
          in: path
          name: owner
          required: true
          schema:
            type: string
        - description: name of the repo
          in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHookOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/Hook"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Create a hook
      tags:
        - repository
  /orgs:
    get:
      operationId: orgGetAll
      parameters:
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/OrganizationList"
      summary: Get list of organizations
      tags:
        - organization
    post:
      operationId: orgCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgOption"
        required: true
        x-originalParamName: organization
      responses:
        "201":
          $ref: "#/components/responses/Organization"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/validationError"
      summary: Create an organization
      tags:
        - organization
  /orgs/{org}:
    delete:
      operationId: orgDelete
      parameters:
        - description: organization that is to be deleted
          in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/empty"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Delete an organization
      tags:
        - organization
    get:
      operationId: orgGet
      parameters:
        - description: name of the organization to get
          in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Organization"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Get an organization
      tags:
        - organization
    patch:
      operationId: orgEdit
      parameters:
        - description: name of the organization to edit
          in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditOrgOption"
        required: true
        x-originalParamName: body
      responses:
        "200":
          $ref: "#/components/responses/Organization"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Edit an organization
      tags:
        - organization
  /orgs/{org}/repos:
    delete:
      operationId: orgDeleteRepos
      parameters:
        - description: name of the organization
          in: path
          name: org
          required: true
          schema:
            type: string
      responses:
        "202":
          $ref: "#/components/responses/empty"
        "204":
          $ref: "#/components/responses/empty"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Delete all repositories in an organization
      tags:
        - organization
    get:
      operationId: orgListRepos
      parameters:
        - description: name of the organization
          in: path
          name: org
          required: true
          schema:
            type: string
        - description: page number of results to return (1-based)
          in: query
          name: page
          schema:
            type: integer
        - description: page size of results
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/RepositoryList"
        "404":
          $ref: "#/components/responses/notFound"
      summary: List an organization's repos
      tags:
        - organization
    post:
      operationId: createOrgRepo
      parameters:
        - description: name of organization
          in: path
          name: org
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoOption"
        x-originalParamName: body
      responses:
        "201":
          $ref: "#/components/responses/Repository"
        "400":
          $ref: "#/components/responses/error"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
      summary: Create a repository in an organization
      tags:
        - organization
components:
  securitySchemes:
    AccessToken:
      description: This authentication option is deprecated for removal in Gitea 1.23.
        Please use AuthorizationHeaderToken instead.
      in: query
      name: access_token
      type: apiKey
    AuthorizationHeaderToken:
      description: API tokens must be prepended with "token" followed by a space.
      in: header
      name: Authorization
      type: apiKey
    BasicAuth:
      scheme: basic
      type: http
    SudoHeader:
      description: Sudo API request as the user provided as the key. Admin privileges
        are required.
      in: header
      name: Sudo
      type: apiKey
    SudoParam:
      description: Sudo API request as the user provided as the key. Admin privileges
        are required.
      in: query
      name: sudo
      type: apiKey
    TOTPHeader:
      description: Must be used in combination with BasicAuth if two-factor
        authentication is enabled.
      in: header
      name: X-GITEA-OTP
      type: apiKey
    Token:
      description: This authentication option is deprecated for removal in Gitea 1.23.
        Please use AuthorizationHeaderToken instead.
      in: query
      name: token
      type: apiKey
  responses:
    AccessToken:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccessToken"
      description: AccessToken represents an API access token.
    AccessTokenList:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/AccessToken"
            type: array
      description: AccessTokenList represents a list of API access token.
    GeneralAPISettings:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeneralAPISettings"
      description: GeneralAPISettings
    Hook:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Hook"
      description: Hook
    HookList:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/Hook"
            type: array
      description: HookList
    Issue:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Issue"
      description: Issue
    IssueList:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/Issue"
            type: array
      description: IssueList
    Organization:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organization"
      description: Organization
    OrganizationList:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/Organization"
            type: array
      description: OrganizationList
    Repository:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Repository"
      description: Repository
    RepositoryList:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/Repository"
            type: array
      description: RepositoryList
    ServerVersion:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServerVersion"
      description: ServerVersion
    User:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
      description: User
    empty:
      description: APIEmpty is an empty response
    error:
      description: APIError is error format response
      headers:
        message:
          schema:
            type: string
        url:
          schema:
            type: string
    forbidden:
      description: APIForbiddenError is a forbidden error response
      headers:
        message:
          schema:
            type: string
        url:
          schema:
            type: string
    notFound:
      description: APINotFound is a not found empty response
    repoArchivedError:
      description: APIRepoArchivedError is an error that is raised when an archived
        repo should be modified
      headers:
        message:
          schema:
            type: string
        url:
          schema:
            type: string
    validationError:
      description: APIValidationError is error format response related to input validation
      headers:
        message:
          schema:
            type: string
        url:
          schema:
            type: string
  schemas:
    AccessLevelName:
      enum:
        - none
        - read
        - write
        - admin
        - owner
      type: string
    AccessToken:
      properties:
        created_at:
          description: The timestamp when the token was created
          format: date-time
          type: string
          x-go-name: Created
        id:
          description: The unique identifier of the access token
          format: int64
          type: integer
          x-go-name: ID
        last_used_at:
          description: The timestamp when the token was last used
          format: date-time
          type: string
          x-go-name: Updated
        name:
          description: The name of the access token
          type: string
          x-go-name: Name
        scopes:
          description: The scopes granted to this access token
          items:
            type: string
          type: array
          x-go-name: Scopes
        sha1:
          description: The SHA1 hash of the access token
          type: string
          x-go-name: Token
        token_last_eight:
          description: The last eight characters of the token
          type: string
          x-go-name: TokenLastEight
      title: AccessToken represents an API access token.
      type: object
      x-go-package: gitea.dev/modules/structs
    Attachment:
      description: Attachment a generic attachment
      properties:
        browser_download_url:
          description: DownloadURL is the URL to download the attachment
          format: uri
          type: string
          x-go-name: DownloadURL
        created_at:
          format: date-time
          type: string
          x-go-name: Created
        download_count:
          description: DownloadCount is the number of times the attachment has been
            downloaded
          format: int64
          type: integer
          x-go-name: DownloadCount
        id:
          description: ID is the unique identifier for the attachment
          format: int64
          type: integer
          x-go-name: ID
        name:
          description: Name is the filename of the attachment
          type: string
          x-go-name: Name
        size:
          description: Size is the file size in bytes
          format: int64
          type: integer
          x-go-name: Size
        uuid:
          description: UUID is the unique identifier for the attachment file
          type: string
          x-go-name: UUID
      type: object
      x-go-package: gitea.dev/modules/structs
    CreateAccessTokenOption:
      description: CreateAccessTokenOption options when create access token
      properties:
        name:
          type: string
          x-go-name: Name
        scopes:
          example:
            - all
            - read:activitypub
            - read:issue
            - write:misc
            - read:notification
            - read:organization
            - read:package
            - read:repository
            - read:user
          items:
            type: string
          type: array
          x-go-name: Scopes
      required:
        - name
      type: object
      x-go-package: gitea.dev/modules/structs
    CreateHookOption:
      description: CreateHookOption options when create a hook
      properties:
        active:
          default: false
          type: boolean
          x-go-name: Active
        authorization_header:
          description: Authorization header to include in webhook requests
          type: string
          x-go-name: AuthorizationHeader
        branch_filter:
          description: Branch filter pattern to determine which branches trigger the webhook
          type: string
          x-go-name: BranchFilter
        config:
          $ref: "#/components/schemas/CreateHookOptionConfig"
        events:
          description: List of events that will trigger this webhook
          items:
            type: string
          type: array
          x-go-name: Events
        name:
          description: Optional human-readable name for the webhook
          type: string
          x-go-name: Name
        type:
          enum:
            - dingtalk
            - discord
            - gitea
            - gogs
            - msteams
            - slack
            - telegram
            - feishu
            - wechatwork
            - packagist
          type: string
          x-go-name: Type
      required:
        - type
        - config
      type: object
      x-go-package: gitea.dev/modules/structs
    CreateHookOptionConfig:
      additionalProperties:
        type: string
      description: |-
        CreateHookOptionConfig has all config options in it
        required are "content_type" and "url" Required
      type: object
